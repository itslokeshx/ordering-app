<html>
  <head>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="root">
      <header>
        <div class="header-content">
          <p>Jimmy’s Diner</p>
          <p>The best burgers and pizzas in town.</p>
        </div>
      </header>
      <div class="container" id="container"></div>
      <div class="billBox" id="billBox">
        <div id="billBoxItems"></div>
        <div class="TotalAmount">
          <p>Total</p>
          <p id="TotalAmount">0</p>
        </div>
        <button id="PlaceOrder">Compelete Order</button>
      </div>
    </div>

    <div class="form" id="popup">
      <h1>Enter Card Details</h1>
      <form onsubmit="event.preventDefault(); validateMyForm();">
        <input
          type="text"
          id="UserName"
          placeholder="Enter your name"
          required
        />
        <input
          type="number"
          placeholder="Enter card numver"
          id="cardNo"
          required
        />
        <input placeholder="Enter CVV" id="cvv" required />

        <button type="submit" id="SubmitForm">Pay</button>
      </form>
    </div>
    <script src="index.js" type="module"></script>
  </body>
</html>
