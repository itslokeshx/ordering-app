<html>
  <head>
    <link
      rel="icon"
      type="image/png"
      sizes="100x100"
      href="https://www.transparentpng.com/thumb/anonymous-mask/anonymous-mask-icon-png-25.png"
      alt="anonymous mask icon png @transparentpng.com"
    />
    <meta charset="UTF-8" />
    <meta name="description" content="Free Web tutorials" />
    <meta name="keywords" content="HTML, CSS, JavaScript" />
    <meta name="author" content="John Doe" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="root">
      <header>
        <div class="header-content">
          <p>Jimmy’s Diner</p>
          <p>The best burgers and pizzas in town.</p>
        </div>
      </header>
      <div class="container" id="container"></div>
      <div class="billBox" id="billBox">
        <div id="billBoxItems"></div>
        <div class="TotalAmount">
          <p>Total</p>
          <p id="TotalAmount">0</p>
        </div>
        <button id="PlaceOrder">Compelete Order</button>
      </div>
    </div>

    <div class="form" id="popup">
      <h2 id="cardtitle">Enter Card Details</h2>
      <form onsubmit="event.preventDefault();">
        <input
          type="text"
          id="UserName"
          placeholder="Enter your name"
          required
        />
        <input
          type="number"
          placeholder="Enter card numver"
          id="cardNo"
          required
        />
        <input placeholder="Enter CVV" id="cvv" required />

        <button type="submit" id="SubmitForm">Pay</button>
      </form>
    </div>
    <script src="index.js"></script>
  </body>
</html>
